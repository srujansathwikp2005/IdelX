---
# =============================================================================
# provision.yml — create the AWS infrastructure IdleX runs on.
#
# Idempotent: every module here converges to a desired state, so running it
# twice makes no changes the second time. That is what lets the same command
# both create a fresh environment and verify an existing one.
#
#   ansible-playbook playbooks/provision.yml
# =============================================================================
- name: Provision IdleX AWS infrastructure
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    # -------------------------------------------------------------------
    # Networking
    # -------------------------------------------------------------------
    - name: Look up the default subnets
      # Deliberately NOT ec2_vpc_net_info: that module also calls
      # DescribeVpcAttribute, which many scoped deployer policies omit, and
      # it fails the whole lookup even though the VPC id is already known.
      # DescribeSubnets returns the VpcId anyway and needs one fewer
      # permission.
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters:
          default-for-az: "true"
      register: default_subnets

    - name: Fail early when no default subnet exists
      ansible.builtin.assert:
        that: default_subnets.subnets | length > 0
        fail_msg: >-
          No default subnet in {{ aws_region }}. Either create a default VPC
          or set aws_vpc_subnet_id in group_vars/all.yml to an existing subnet.

    - name: Derive the VPC from the default subnets
      ansible.builtin.set_fact:
        target_vpc_id: "{{ default_subnets.subnets[0].vpc_id }}"

    - name: Create the application security group
      amazon.aws.ec2_security_group:
        name: "{{ project_name }}-{{ env_name }}-sg"
        description: "IdleX {{ env_name }} — web + ssh ingress"
        vpc_id: "{{ target_vpc_id }}"
        region: "{{ aws_region }}"
        rules:
          # SSH is intentionally the narrowest rule. Override ssh_cidr on the
          # command line to lock it to your office/VPN range; 0.0.0.0/0 is the
          # default only because CI runners have no fixed egress ip.
          - proto: tcp
            ports: [22]
            cidr_ip: "{{ ssh_cidr | default('0.0.0.0/0') }}"
            rule_desc: SSH admin access
          - proto: tcp
            ports: [80]
            cidr_ip: 0.0.0.0/0
            rule_desc: HTTP
          - proto: tcp
            ports: [443]
            cidr_ip: 0.0.0.0/0
            rule_desc: HTTPS
        # Node listens only on 127.0.0.1; ports 3000/5000 are deliberately
        # NOT opened. Everything public goes through nginx.
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
            rule_desc: Allow all outbound
        tags:
          Project: "{{ project_name }}"
          Env: "{{ env_name }}"
      register: app_sg

    # -------------------------------------------------------------------
    # Object storage — private bucket for user uploads
    # -------------------------------------------------------------------
    - name: Create the uploads bucket
      # Skipped alongside IAM: without an instance profile the app cannot
      # reach the bucket anyway, so creating one would be misleading.
      when: manage_iam | bool
      amazon.aws.s3_bucket:
        name: "{{ s3_bucket }}"
        region: "{{ aws_region }}"
        # KYC documents are identity papers. Public access is blocked at the
        # bucket level so a bad object ACL cannot expose them by accident.
        public_access:
          block_public_acls: true
          ignore_public_acls: true
          block_public_policy: true
          restrict_public_buckets: true
        encryption: AES256
        versioning: true          # an overwrite or bad delete stays recoverable
        tags:
          Project: "{{ project_name }}"
          Env: "{{ env_name }}"

    # -------------------------------------------------------------------
    # IAM — instance profile so the app needs no long-lived AWS keys
    # -------------------------------------------------------------------
    - name: Create the EC2 IAM role
      when: manage_iam | bool
      amazon.aws.iam_role:
        name: "{{ project_name }}-{{ env_name }}-ec2-role"
        assume_role_policy_document: "{{ lookup('file', '../files/ec2-trust-policy.json') }}"
        create_instance_profile: true
        managed_policies:
          # CloudWatch agent + SSM Session Manager as a break-glass path in
          # when ssh is unavailable (which has already happened once here).
          - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        tags:
          Project: "{{ project_name }}"
          Env: "{{ env_name }}"
      register: ec2_role

    - name: Attach a least-privilege S3 policy to the role
      when: manage_iam | bool
      amazon.aws.iam_policy:
        iam_type: role
        iam_name: "{{ ec2_role.role_name }}"
        policy_name: "{{ project_name }}-{{ env_name }}-s3-uploads"
        state: present
        # Scoped to this bucket and this prefix only — the instance cannot
        # read or write anything else in the account.
        policy_json: "{{ lookup('template', '../templates/s3-policy.json.j2') }}"

    # -------------------------------------------------------------------
    # Compute
    # -------------------------------------------------------------------
    - name: Find the latest Amazon Linux 2023 AMI
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners: "{{ ec2_ami_owner }}"
        filters:
          name: "{{ ec2_ami_name_filter }}"
          state: available
      register: ami_search

    - name: Select the newest matching AMI
      ansible.builtin.set_fact:
        selected_ami: "{{ (ami_search.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Launch (or converge) the application instance
      amazon.aws.ec2_instance:
        name: "{{ project_name }}-{{ env_name }}"
        region: "{{ aws_region }}"
        key_name: "{{ ec2_key_name }}"
        instance_type: "{{ ec2_instance_type }}"
        image_id: "{{ selected_ami }}"
        security_groups: ["{{ app_sg.group_id }}"]
        vpc_subnet_id: "{{ aws_vpc_subnet_id | default(omit, true) }}"
        # Falls back to an externally-created profile, then to none at all.
        iam_instance_profile: >-
          {{ ec2_role.role_name if (manage_iam | bool)
             else (ec2_instance_profile | default(omit, true)) }}
        network:
          assign_public_ip: true
        volumes:
          - device_name: /dev/xvda
            ebs:
              volume_size: "{{ ec2_volume_size }}"
              volume_type: gp3
              delete_on_termination: true
        # These tags are the contract with inventory/aws_ec2.yml — the
        # dynamic inventory finds the host by exactly these keys.
        tags:
          Project: "{{ project_name }}"
          Env: "{{ env_name }}"
          Role: web
        state: running
        wait: true
      register: ec2_result

    - name: Wait for SSH to accept connections
      ansible.builtin.wait_for:
        host: "{{ ec2_result.instances[0].public_ip_address }}"
        port: 22
        delay: 10
        timeout: 300
        state: started

    - name: Add the new host to the in-memory inventory
      # Lets a single `site.yml` run flow straight from provision into
      # configure without a second command or an inventory refresh.
      ansible.builtin.add_host:
        name: "{{ ec2_result.instances[0].public_ip_address }}"
        groups: role_web
        ansible_user: "{{ app_user }}"
        ansible_ssh_private_key_file: "{{ ec2_ssh_private_key }}"

    - name: Report what was provisioned
      ansible.builtin.debug:
        msg: >-
          Instance {{ ec2_result.instances[0].instance_id }}
          ({{ ec2_instance_type }}) at {{ ec2_result.instances[0].public_ip_address }}.
          {{ 'Bucket ' ~ s3_bucket ~ ' ready.' if (manage_iam | bool)
             else 'IAM/S3 SKIPPED (manage_iam=false) — uploads will use local disk.' }}
          Next: ansible-playbook playbooks/configure.yml

    - name: Warn about degraded storage
      ansible.builtin.debug:
        msg: >-
          WARNING: running without an instance profile. Uploads go to local
          disk, which means they are lost if the instance is replaced and
          cannot be shared across instances. Grant the deployer IAM
          permissions (see docs/iam-bootstrap-policy.json) and re-run with
          manage_iam=true to move them to S3.
      when: not (manage_iam | bool)
