# Ansible configuration for the IdleX rollout.
# Every path here is relative to deploy/, so all commands are run from
# this directory (or via scripts/deploy.sh, which cds here for you).
[defaults]
inventory            = inventory/aws_ec2.yml
roles_path           = roles
host_key_checking    = False      ; freshly provisioned hosts have no known_hosts entry
retry_files_enabled  = False
# community.general.yaml was removed in that collection's v12; the built-in
# default callback with result_format=yaml is the supported replacement.
stdout_callback      = default
result_format        = yaml
interpreter_python   = auto_silent
# Provisioning targets localhost while configuration targets EC2; facts are
# cheap to re-gather and staleness here causes confusing bugs.
gathering            = smart
timeout              = 30

[ssh_connection]
# ControlMaster keeps one SSH connection open across tasks — the single
# biggest speedup for a role-heavy play over a high-latency link.
# ForwardAgent lets the instance authenticate to GitHub with the operator's
# own key for the duration of the run, so no deploy key is ever written to
# the server. Requires a loaded ssh-agent on the control node:
#   eval "$(ssh-agent)" && ssh-add ~/.ssh/id_ed25519
ssh_args      = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30 -o ForwardAgent=yes
pipelining    = True
